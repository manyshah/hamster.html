<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل کاربر</title><link rel="stylesheet" href="../style.css"></head><body><main class="app-shell"><script src="../script.js"></script><script>shell('profile')</script><section class="page-title"><div class="container"><h1>پروفایل کاربر</h1></div></section><section class="section"><div class="container grid cards-2"><div class="card profile-hero"><div class="avatar"><img src="../assets/icons/hamster.svg" alt=""></div><div><h2 id="profileName"></h2><p>سطح فعلی: مراقب تازه‌کار</p></div></div><div class="card"><h2>ویرایش نام</h2><input id="nameInput" style="width:100%;padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)" placeholder="نام شما"><button class="btn btn-primary" onclick="saveProfile()" style="margin-top:12px">ذخیره</button></div><div class="card"><h2>پیشرفت</h2><p>۴ آموزش فعال، ۱ آزمون تکمیل‌شده</p><div class="progress"><span style="width:58%"></span></div></div></div></section><script>initProfile()</script></main></body></html>
